name: Auto RT Bot

on:
  schedule:
    - cron: '3,33 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-retweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run RT bot
        env:
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          POSTER_ACCESS_TOKEN: ${{ secrets.POSTER_ACCESS_TOKEN }}
          POSTER_ACCESS_SECRET: ${{ secrets.POSTER_ACCESS_SECRET }}
          TARGET_USERNAME: ${{ secrets.TARGET_USERNAME }}
        run: node rt-bot.js

      - name: Commit updated state
        run: |
          git config user.name "rt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state.json"
          git push
